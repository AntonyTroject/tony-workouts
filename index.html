<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workouts</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0a09">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Unbounded:wght@600;800&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Black + yellow. One column, thumb-first. Yellow only for what she taps or what's done. */
:root{
  --bg:#0a0a09;
  --card:rgba(17,17,15,.86);
  --card-2:#1c1b17;
  --line:#2a2924;
  --fg:#f5f3ea;
  --mute:#8f8b7c;
  --y:#ffd200;
  --y-dim:rgba(var(--yr),.14);
  --y-hi:#ffe04d;--y-lo:#e6b800;--y-edge:#b38f00;--yr:255,210,0;--ink:#0a0a09;
  --danger:#ff6b5b;
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Unbounded","Montserrat",system-ui,sans-serif;
  --amber:#d8902a;
  --knurl:repeating-linear-gradient(45deg,rgba(10,10,9,.13) 0 1.5px,transparent 1.5px 6px),repeating-linear-gradient(-45deg,rgba(10,10,9,.13) 0 1.5px,transparent 1.5px 6px);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid::before,.grid::after{content:"";position:absolute;inset:-1px;background-image:linear-gradient(var(--amber) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--amber) 1.5px,transparent 1.5px);background-size:54px 54px;background-position:center -1px}
.grid::before{opacity:.32;-webkit-mask-image:radial-gradient(120% 90% at 50% 30%,#000 20%,transparent 85%);mask-image:radial-gradient(120% 90% at 50% 30%,#000 20%,transparent 85%)}
.grid::after{opacity:.6;-webkit-mask-image:radial-gradient(42% 24% at 50% 22%,#000 35%,transparent 100%);mask-image:radial-gradient(42% 24% at 50% 22%,#000 35%,transparent 100%)}
.app{position:relative;z-index:1}
.panel,.day,.btn,.ghost{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:22px}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--y)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,44px);line-height:1.02;margin:0;letter-spacing:-.03em;text-wrap:balance}
h2{font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--mute)}
.mute{color:var(--mute)}
.small{font-size:13px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--y);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;height:40px;padding:0 14px;font:600 13px var(--f);display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.btn.y{background:var(--knurl),linear-gradient(180deg,var(--y-hi),var(--y) 55%,var(--y-lo));color:#0a0a09;border-color:var(--y-edge);font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.18)}
.btn.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:2px solid var(--y);outline-offset:2px}

.intro{display:flex;flex-direction:column;gap:10px}
.intro p{margin:0;color:var(--mute);max-width:40ch}

/* day cards */
.days{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.day{appearance:none;text-align:left;border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--card);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.day .letter{font-family:var(--f-display);font-weight:800;font-size:58px;line-height:.9;letter-spacing:-.04em}
.day .focus{font-size:13px;font-weight:500;color:var(--mute);line-height:1.35}
.day .meta{font-size:11px;font-weight:600;color:var(--mute)}
.day.next{background:var(--knurl),linear-gradient(160deg,var(--y-hi),var(--y) 50%,var(--y-lo));border-color:var(--y-edge);color:#0a0a09;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 18px 50px -18px rgba(var(--yr),.55)}
.day.next .focus,.day.next .meta{color:rgba(10,10,9,.7)}
.tag{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:#0a0a09;color:var(--y)}
.tag.off{visibility:hidden}

.section{display:flex;flex-direction:column;gap:10px}
.panel{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:16px}

/* volume */
.vol{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center}
.vrow span:first-child{font-size:14px;font-weight:600}
.vrow .n{font-size:12px;font-weight:700;color:var(--mute)}
.vrow .bar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--card-2);overflow:hidden}
.vrow .bar i{display:block;height:100%;border-radius:6px;background:var(--y)}

/* admin */
.hitem.warn small{color:var(--danger)}
.alink{display:flex;gap:10px;align-items:center;justify-content:space-between}
.alink code{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.atabs{display:flex;gap:8px}
.prog{display:flex;flex-direction:column;gap:12px}
.prog .pl{font-size:13px;color:var(--mute);line-height:1.6}
.prog .pl b{color:var(--fg);font-weight:600}
.hdetail i{font-style:normal;color:var(--mute)}

/* history */
.hitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);text-align:left;font:inherit;width:100%;cursor:pointer}
.hitem:first-child{border-top:0;padding-top:0}
.hitem .d{font-weight:900;font-size:17px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--y-dim);color:var(--y)}
.hitem small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.hitem .t{font-weight:600;text-transform:capitalize}
.hdetail{padding:0 0 14px 48px;font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.hdetail b{color:var(--fg);font-weight:600}
.empty{color:var(--mute);font-size:14px;margin:0}

/* data */
.data p{margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* workout */
.wkhead{display:flex;flex-direction:column;gap:10px}
.daterow{display:flex;gap:10px;align-items:center}
input[type=date]{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:8px 10px;font:600 14px var(--f)}
.ex{display:flex;flex-direction:column;gap:12px}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exhead>div{min-width:0}
.exn{font-weight:700;font-size:16px;margin:0}
.exn .idx{color:var(--y);margin-right:8px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--card-2);color:var(--mute)}
.chip.side{color:var(--y);background:var(--y-dim)}
.note{font-size:13px;color:var(--mute);margin:0}
.swap{appearance:none;border:1px solid var(--line);background:var(--card-2);color:var(--y);border-radius:10px;font:600 12px var(--f);padding:7px 9px;cursor:pointer;white-space:nowrap;flex:none}
.prev{font-size:12px;font-weight:500;color:var(--mute)}
.prev b{color:var(--fg);font-weight:700}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.setrow .n{font-size:13px;font-weight:800;color:var(--mute);text-align:center}
.field{position:relative}
.field input{width:100%;background:var(--card-2);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:11px 36px 11px 11px;font:700 16px var(--f);font-variant-numeric:tabular-nums}
.field input::placeholder{color:#5c594f;font-weight:500}
.field em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--mute);font-style:normal;pointer-events:none}
.bw{font-size:12px;color:var(--mute);padding-left:4px}
.extools{display:flex;gap:6px;flex:none}
.nbtn{display:grid;place-items:center;padding:6px 8px}
.nbtn svg{width:16px;height:16px;display:block}
body .nbtn[aria-pressed=true]{--hf:rgba(var(--yr),.16)}
.exnote{display:grid;gap:8px;margin-top:10px}
.exnote .old{font-size:13px;color:var(--mute);background:var(--card-2);border-left:2px solid var(--line);padding:8px 10px;white-space:pre-wrap;user-select:text}
.exnote .old span{display:block;font-size:11px;font-weight:600;margin-bottom:3px}
.exnote textarea{min-height:60px}
.setrow.has-rpe{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) auto 46px}
.rpe{font-size:11px;font-weight:700;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.tick{appearance:none;width:46px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);color:var(--mute);cursor:pointer;display:grid;place-items:center}
.tick svg{width:18px;height:18px}
.tick.on{background:var(--knurl),var(--y);color:#0a0a09;border-color:var(--y-edge)}
.setrow.done .field input{border-color:rgba(var(--yr),.45)}
.cardio{display:flex;align-items:center;justify-content:space-between;gap:12px}
textarea{width:100%;min-height:70px;background:var(--card-2);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:10px;font:500 14px var(--f);resize:vertical}
.saved{display:flex;flex-direction:column;gap:12px;border-color:var(--y)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.dock .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
.cta{flex:1;appearance:none;position:relative;border:1px solid var(--y-edge);border-radius:16px;padding:17px;font:800 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:#0a0a09;
  background:linear-gradient(90deg,transparent calc(18% - 2px),rgba(10,10,9,.35) calc(18% - 2px) 18%,transparent 18% 82%,rgba(10,10,9,.35) 82% calc(82% + 2px),transparent calc(82% + 2px)),linear-gradient(90deg,var(--y-hi) 0 18%,transparent 18% 82%,var(--y-hi) 82%),var(--knurl),linear-gradient(180deg,var(--y-hi),var(--y) 55%,var(--y-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.2),0 14px 40px -14px rgba(var(--yr),.7);transition:transform .08s,box-shadow .08s}
.cta span{position:relative;z-index:1}
.cta:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.2)}
.ghost{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:0 16px;font:600 14px var(--f);cursor:pointer}
.progress{font-size:13px;font-weight:800;color:var(--y)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--y);color:#0a0a09;font:700 13px var(--f);padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:calc(100% - 32px);text-align:center}

/* ===== HUD game style: sharp corners, yellow corner brackets ===== */
.cta,.btn,.ghost,.day,.panel,.swap{
  --k:12px;--t:2px;--hc:rgba(var(--yr),.4);--hf:rgba(17,17,15,.86);
  border:0!important;border-radius:0!important;
  box-shadow:inset 0 0 0 1px rgba(var(--yr),.07)!important;
  background:
    linear-gradient(var(--hc),var(--hc)) 0 0/var(--k) var(--t) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 0 0/var(--t) var(--k) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 100% 0/var(--k) var(--t) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 100% 0/var(--t) var(--k) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 0 100%/var(--k) var(--t) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 0 100%/var(--t) var(--k) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 100% 100%/var(--k) var(--t) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 100% 100%/var(--t) var(--k) no-repeat,
    linear-gradient(var(--hf),var(--hf))!important;
}
.panel{--k:14px;--hc:rgba(var(--yr),.32)}
.panel.saved{--hc:var(--y);--t:3px}
.day{--k:16px;--hc:rgba(var(--yr),.32)}
.day.next{--hc:var(--y);--t:3px;--hf:rgba(var(--yr),.08);color:var(--fg)}
.day.next .letter{color:var(--y);text-shadow:0 0 18px rgba(var(--yr),.45)}
.day.next .focus,.day.next .meta{color:var(--mute)}
.tag{border-radius:0;background:var(--y);color:var(--ink,#0a0a09)}
.cta{--k:16px;--t:3px;--hc:var(--y);--hf:color-mix(in srgb,var(--y) 8%,#121210);color:var(--y);text-shadow:0 0 12px rgba(var(--yr),.55);transition:transform .08s}
.cta:active{--hf:color-mix(in srgb,var(--y) 20%,#121210);transform:translateY(1px)}
.btn{--k:9px;--hf:rgba(17,17,15,.9)}
.btn.y{--hc:var(--y);--hf:rgba(var(--yr),.08);color:var(--y)}
.btn.danger{--hc:rgba(255,107,91,.6)}
.ghost{--k:10px;--hc:rgba(245,243,234,.4);--hf:#141412}
.swap{--k:8px;--hc:rgba(var(--yr),.55);--hf:rgba(var(--yr),.04)}
.tick{border-radius:0}
.tick.on{background:var(--y)!important;border-color:var(--y);color:#0a0a09;box-shadow:0 0 14px rgba(var(--yr),.35)}
.field input,textarea,input[type=date]{border-radius:2px}
.chip{border-radius:0}
.logo{border-radius:0;box-shadow:0 0 16px rgba(var(--yr),.35)}
.hitem .d{border-radius:0;background:transparent;box-shadow:inset 0 0 0 1.5px rgba(var(--yr),.5)}
.vrow .bar{height:8px;border-radius:0;background:repeating-linear-gradient(90deg,var(--card-2) 0 10px,transparent 10px 13px)}
.vrow .bar i{border-radius:0;background:repeating-linear-gradient(90deg,var(--y) 0 10px,transparent 10px 13px);filter:drop-shadow(0 0 4px rgba(var(--yr),.5))}
.toast{border-radius:0}

/* volume segments: one per set, count = max group */
.vrow .seg{grid-column:1/-1;display:grid;grid-template-columns:repeat(var(--cols,10),1fr);gap:clamp(2px,40px / var(--cols,10),4px)}
.vrow .seg i{height:9px;background:var(--card-2);box-shadow:inset 0 0 0 1px rgba(var(--yr),.08)}
.vrow .seg i.on{background:var(--y);box-shadow:0 0 6px rgba(var(--yr),.5)}
.vrow .seg i.part{background:linear-gradient(90deg,var(--y) var(--p),var(--card-2) var(--p))}

/* workout view: dim + slight blur over grid, quiet panels */
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;background:rgba(10,10,9,.15);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:opacity .25s}
body[data-view=workout] .veil{opacity:1}
body[data-view=workout] .panel,body[data-view=workout] .swap{--hc:transparent;box-shadow:inset 0 0 0 1px var(--line)!important}
body[data-view=workout] .swap{color:var(--y)}

/* check buttons */
.tick{--k:9px;--t:2px;--hc:rgba(var(--yr),.5);position:relative;border:0!important;color:#5f5b4f;
  background:
    linear-gradient(var(--hc),var(--hc)) 0 0/var(--k) var(--t) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 0 0/var(--t) var(--k) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 100% 0/var(--k) var(--t) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 100% 0/var(--t) var(--k) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 0 100%/var(--k) var(--t) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 0 100%/var(--t) var(--k) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 100% 100%/var(--k) var(--t) no-repeat,
    linear-gradient(var(--hc),var(--hc)) 100% 100%/var(--t) var(--k) no-repeat,
    linear-gradient(180deg,#1f1e1a,#121210)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -2px 0 rgba(0,0,0,.4)!important;transition:transform .08s}
.tick:active{transform:scale(.94)}
.tick.on{color:#0a0a09;--hc:#0a0a09;
  background:
    linear-gradient(var(--hc),var(--hc)) 3px 3px/7px 2px no-repeat,
    linear-gradient(var(--hc),var(--hc)) 3px 3px/2px 7px no-repeat,
    linear-gradient(var(--hc),var(--hc)) calc(100% - 3px) calc(100% - 3px)/7px 2px no-repeat,
    linear-gradient(var(--hc),var(--hc)) calc(100% - 3px) calc(100% - 3px)/2px 7px no-repeat,
    linear-gradient(180deg,var(--y),var(--y-lo) 60%,var(--y-edge))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.2),0 0 0 1px var(--y-edge),0 0 8px rgba(var(--yr),.16)!important}
.tick.on svg{animation:pop .22s ease-out}
.tick svg{width:20px;height:20px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.tick.on svg{animation:none}.veil{transition:none}}

/* home: feathered blur behind text (on a pseudo layer, so text stays crisp) */
body[data-view=home] .brand .eyebrow,
body[data-view=home] .intro h1,
body[data-view=home] .intro p,
body[data-view=home] .section>h2{position:relative;isolation:isolate;align-self:flex-start;width:fit-content;max-width:100%}
body[data-view=home] .brand .eyebrow::before,
body[data-view=home] .intro h1::before,
body[data-view=home] .intro p::before,
body[data-view=home] .section>h2::before{content:"";position:absolute;inset:-14px -28px;z-index:-1;pointer-events:none;
  background:rgba(10,10,9,.1);backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px);
  -webkit-mask-image:radial-gradient(closest-side,#000 60%,transparent);mask-image:radial-gradient(closest-side,#000 60%,transparent)}

/* exercise block: all sets done */
body[data-view=workout] .panel.ex{transition:box-shadow .3s}
body[data-view=workout] .panel.ex.complete{--hf:color-mix(in srgb,var(--y) 9%,#121210);box-shadow:inset 0 0 0 1px rgba(var(--yr),.4),0 0 22px rgba(var(--yr),.12)!important}
.sync{margin:-4px 0 0;color:var(--mute)}
.sync.ok::before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;background:#7fe08a;box-shadow:0 0 6px #7fe08a;vertical-align:1px}
.sync.off::before,.sync.wait::before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;background:var(--mute);vertical-align:1px}
/* set rows: dim idle check, warm highlight when done */
.setrow{padding:4px;margin:0 -4px;transition:background .2s}
.setrow.done{background:rgba(var(--yr),.1);box-shadow:inset 2px 0 0 var(--y-lo)}
.setrow .field input{transition:background .2s,border-color .2s}
.setrow.done .field input{background:rgba(var(--yr),.12);border-color:rgba(var(--yr),.5)}

.btn:disabled{opacity:.35;cursor:default}

.mchip.on{color:var(--y);border-color:var(--y);background:rgba(var(--yr),.1)}

/* ---------- программа (приходит из таблицы) ---------- */
let PROGRAM={},DAYS=[],ALL_EX={};
function setProgram(days){
  PROGRAM=days||{};Object.values(PROGRAM).forEach(d=>(d.ex||[]).forEach(e=>{const l=scheme(e.reps);if(l.length>1)e.sets=l.length}));DAYS=Object.keys(PROGRAM).filter(d=>PROGRAM[d].ex&&PROGRAM[d].ex.length).sort();
  ALL_EX={};DAYS.forEach(d=>PROGRAM[d].ex.forEach(e=>{ALL_EX[e.id]=e;if(e.alt)ALL_EX[e.alt.id]={...e,...e.alt,muscles:e.alt.muscles||e.muscles}}));
}
const variant=(ex,v)=>v==='alt'&&ex.alt?{...ex,...ex.alt,muscles:ex.alt.muscles||ex.muscles}:ex;
const GROUP_ALIAS={'Lower back':'Back','Upper back':'Back','Glute med':'Glutes'};
const GROUP_ORDER=['Glutes','Hamstrings','Quads','Back','Chest','Abs'];
const groupOf=e=>{const g=canon((e.muscles&&e.muscles[0])||'Other');return GROUP_ALIAS[g]||g};
const sorted=()=>[...store.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.saved-a.saved);
const lastSession=()=>sorted()[0];
function nextDay(){const l=lastSession();if(!l||!DAYS.length)return DAYS[0];const i=DAYS.indexOf(l.day);return DAYS[(i+1)%DAYS.length]}
function lastNoteFor(id){const s=sorted().find(s=>s.ex[id]&&s.ex[id].note);return s?{date:s.date,note:s.ex[id].note}:null}
// RPE: одно значение на все подходы («8-9») или своё на каждый («4, 5, 6»)
// «1*1, 3*6» → [1,6,6,6]; «4, 5, 6» → [4,5,6]; «8-12» → [8-12]
function scheme(v){const out=[];String(v||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(p=>{
  const m=p.match(/^(\d+)\s*[*×xх]\s*(.+)$/i);if(m)for(let i=0;i<+m[1];i++)out.push(m[2].trim());else out.push(p)});return out}
function rpeAt(v,k){const l=scheme(v);return l.length>1?(l[k]||l[l.length-1]):(l[0]||'')}
const restTxt=v=>/^\d+([.,]\d+)?(\s*[-–]\s*\d+([.,]\d+)?)?$/.test(v)?v+' '+t('min'):v;
function lastFor(id){const s=sorted().find(s=>s.ex[id]&&s.ex[id].sets.some(x=>x&&(x.w||x.r||x.done)));return s?{date:s.date,sets:s.ex[id].sets}:null}
const setTxt=(x,unit)=>unit==='s'?(x.r?x.r+t('s'):''):`${x.w?x.w:''}${x.w&&x.r?'×':''}${x.r||''}${unit==='kgs'&&x.r?t('s'):''}`;
const fmtN=n=>lang==='ru'?String(n).replace('.',','):String(n);
// делений столько, сколько подходов у самой нагруженной мышцы; 1 деление = 1 подход, дробный закрашивается частично
const segs=(n,cols)=>Array.from({length:cols},(_,k)=>k+1<=n+1e-9?'<i class="on"></i>':k<n?`<i class="part" style="--p:${Math.round((n-k)*100)}%"></i>`:'<i></i>').join('');
const hasW=u=>u==='kg'||u==='kgs';
// Объём: первая мышца получает подход целиком, остальные — по половине (одна группа в упражнении — один раз)
function weeklyVolume(){const v={};DAYS.forEach(d=>PROGRAM[d].ex.forEach(e=>{const w={};
    (e.muscles&&e.muscles.length?e.muscles:['Other']).forEach((m,i)=>{const g=GROUP_ALIAS[canon(m)]||canon(m);w[g]=Math.max(w[g]||0,i?.5:1)});
    Object.entries(w).forEach(([g,k])=>{v[g]=(v[g]||0)+k*e.sets})}));
  const rank=g=>{const i=GROUP_ORDER.indexOf(g);return i<0?99:i};
  return Object.fromEntries(Object.entries(v).sort((a,b)=>rank(a[0])-rank(b[0])))}
/* ---------- views ---------- */

  if(ADMIN)return renderAdmin();

}

/* ответы тренера: ключ ответа = тренировка|упражнение|время; '' вместо упражнения = заметка к тренировке */
const rkey=r=>`${r.sid}|${r.ex}|${r.at}`;
const replyOf=(rs,sid,ex)=>(rs||[]).find(r=>r.sid===sid&&r.ex===ex);
const trHtml=(r,label)=>r?`<div class="tr"><span>${label||t('trainer')}</span> ${esc(r.text)}</div>`:'';
function repliesPanel(){
  const seen=new Set(store.seen||[]),L=(store.replies||[]).filter(r=>!seen.has(rkey(r)));if(!L.length)return '';
  return `<div class="panel saved"><span class="eyebrow">${t('trNew')}</span>${L.map(r=>{const s=store.sessions.find(x=>x.saved===r.sid);

    return `<div><p class="exn" style="font-size:14px">${esc(n)}${s?' · '+fmtDate(s.date,{day:'numeric',month:'short'}):''}</p><p class="note" style="color:var(--fg);white-space:pre-wrap">${esc(r.text)}</p></div>`}).join('')}
    <div class="btnrow"><button class="btn" data-seen>${t('gotIt')}</button></div></div>`}

function renderHome(){
  const nd=nextDay(),vol=weeklyVolume(),volMax=Math.ceil(Math.max(1,...Object.values(vol)));
  const card=d=>{const p=PROGRAM[d];const ls=sorted().find(s=>s.day===d);
    return `<button class="day ${d===nd?'next':''}" data-start="${esc(d)}">
      <span class="tag ${d===nd?'':'off'}">${t('next')}</span>
      <span class="letter">${esc(d)}</span>
      <span class="focus">${esc(tr(p.focus))}</span>
      <span class="meta">${t('setsN',p.ex.reduce((a,e)=>a+e.sets,0))}${p.cardio?' · '+esc(tr(p.cardio.name).toLowerCase()):''}${ls?`<br>${t('last',fmtDate(ls.date,{day:'numeric',month:'short'}))}`:''}</span>
    </button>`};
  const ss=sorted();
  const hist=ss.length?ss.map(s=>{
    const n=Object.values(s.ex).reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);const open=openHist===s.saved;
    return `<button class="hitem" data-hist="${s.saved}" aria-expanded="${open}"><span class="d">${esc(s.day)}</span>
      <span><span class="t">${fmtDate(s.date,{weekday:'long',day:'numeric',month:'long'})}</span><small>${t('setsN',n)}${s.cardio?' · '+t('cardio'):''}${s.pending?' · '+t('waiting'):''}</small></span>
      <span class="mute">${open?'−':'+'}</span></button>
      ${open?`<div class="hdetail">${Object.entries(s.ex).map(([id,e])=>`<div><b>${esc(tr(e.name))}</b> ${e.feel?feelIcon(e.feel):''} ${e.sets.filter(x=>x.w||x.r).map(x=>setTxt(x,(ALL_EX[id]||e).unit)).join(', ')||'—'}${e.note?`<br><i>«${esc(e.note)}»</i>`:''}${trHtml(replyOf(store.replies,s.saved,id))}</div>`).join('')}

/* ---------- сервер (Google Таблица) ---------- */
async function api(body){
  if(!body){
    const r=await fetch(API_URL+'?code='+encodeURIComponent(CODE),{redirect:'follow'});
    return r.json();
  }
  const r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({c:CODE,...body})});
  return r.json();
}
function forServer(s){const o=JSON.parse(JSON.stringify(s));delete o.pending;Object.entries(o.ex).forEach(([id,e])=>{e.group=groupOf(ALL_EX[id]||{})});return o}
async function push(s){
  s.pending=true;save();
  try{const r=await api({op:'put',session:forServer(s)});if(!r.ok)throw r;delete s.pending;save();sync='ok'}
  catch(e){sync=e&&e.error==='unknown_client'?'bad':'err'}
  if(view==='home')render();
}
async function removeRemote(id){
  store.deleted=[...(store.deleted||[]),id];save();
  try{const r=await api({op:'del',id});if(r.ok){store.deleted=store.deleted.filter(x=>x!==id);save()}}catch(e){}
}
async function refresh(){
  if(ADMIN)return adminLoad();
  if(!CODE)return;
  if(API_URL.startsWith('ВСТАВЬ')){sync='err';render();return}
  try{
    const r=await api();
    if(!r.ok){sync=r.error==='unknown_client'?'bad':'err';render();return}
    if(r.client){const sl=LANGS.some(l=>l[0]===r.client.lang)?r.client.lang:'';
      if(store.langPending)pushLang();
      else if(sl){store.clientLang=sl;if(lang!==sl){lang=sl;langChosen=true;document.documentElement.lang=sl;try{localStorage.setItem('vt_lang',sl)}catch(e){}render()}}
      else if(langChosen){store.langPending=lang;pushLang()} // сервер ещё не знает язык, а человек уже выбирал: запоминаем в таблице
    }
    store.days=r.days;store.replies=r.replies||[];setProgram(r.days);
    const del=new Set(store.deleted||[]);
    const remote=(r.sessions||[]).filter(s=>!del.has(s.saved));
    const ids=new Set(remote.map(s=>s.saved));
    const pending=store.sessions.filter(s=>s.pending&&!ids.has(s.saved));
    store.sessions=[...remote,...pending];save();sync='ok';
    pending.forEach(push);(store.deleted||[]).forEach(id=>removeRemote(id));
  }catch(e){sync='err'}
  if(view==='home'||!DAYS.length)render();
}

const byDate=ss=>[...ss].sort((a,b)=>b.date.localeCompare(a.date)||b.saved-a.saved);
const agoTxt=iso=>{const n=daysAgo(iso);return n<=0?t('today'):n===1?t('yesterday'):t('daysAgo',n)};
const exSets=(e)=>e.sets.filter(x=>x&&(x.w||x.r)).map(x=>setTxt(x,e.unit)).join(', ')||'—';
// лучший подход тренировки: больше вес, при равном — больше повторов
function bestSet(e){let b=null;e.sets.forEach(x=>{if(!x||!(x.w||x.r))return;const w=+x.w||0,r=+x.r||0;
  if(!b||w>b.wn||(w===b.wn&&r>b.rn))b={...x,wn:w,rn:r}});return b}
function progress(c){const m={};byDate(c.sessions).reverse().forEach(s=>Object.entries(s.ex).forEach(([id,e])=>{const b=bestSet(e);if(!b)return;
    const p=m[id]||(m[id]={name:e.name,unit:e.unit,last:'',pts:[]});p.name=e.name;p.last=s.date;p.pts.push({date:s.date,b})}));
  return Object.values(m).sort((a,b)=>b.last.localeCompare(a.last)||a.name.localeCompare(b.name))}
// упражнения с болью (4) за последние 2 недели
const painOf=ss=>[...new Set(ss.filter(s=>daysAgo(s.date)<=14).flatMap(s=>Object.values(s.ex).filter(e=>e.feel===4).map(e=>tr(e.name))))];

/* активность по неделям (пн–вс), серия, застой */
const weekStart=iso=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return d.toISOString().slice(0,10)};
function activity(ss,n=8){const a=Array(n).fill(0),cur=new Date(weekStart(todayISO())+'T12:00:00');
  ss.forEach(s=>{const k=n-1+Math.round((new Date(weekStart(s.date)+'T12:00:00')-cur)/6048e5);if(k>=0&&k<n)a[k]++});return a}
function streak(a){let i=a.length-1,n=0;if(!a[i])i--;while(i>=0&&a[i]>0){n++;i--}return n}
const actBars=a=>`<span class="act" role="img" aria-label="${esc(t('actAria',a.join(', ')))}">${a.map(n=>`<i class="${n?'':'z'}" style="--h:${Math.min(n,5)*20}%"></i>`).join('')}</span>`;
// «оценка» подхода: вес с поправкой на повторы (для упражнений без веса — повторы)
const score=(b,unit)=>hasW(unit)?(+b.w||0)*(1+(+b.r||0)/30):(+b.r||0);
// застой: последние 3 тренировки не лучше той, что была перед ними
function plateau(c){return progress(c).filter(p=>{if(p.pts.length<4||daysAgo(p.last)>21)return false;
  const sc=p.pts.map(x=>score(x.b,p.unit)),n=sc.length;return sc[n-4]>0&&sc.slice(-3).every(v=>v<=sc[n-4]+1e-9)}).map(p=>tr(p.name))}
function chart(p){const pts=p.pts.slice(-12),v=pts.map(x=>hasW(p.unit)?(+x.b.w||0):(+x.b.r||0)),W=300,H=76,px=10,py=10,
    mn=Math.min(...v),mx=Math.max(...v),X=i=>pts.length===1?W/2:px+i*(W-2*px)/(pts.length-1),Y=x=>mx===mn?H/2:H-py-(x-mn)*(H-2*py)/(mx-mn);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr(p.name))}: ${v.join(', ')}"><path d="${v.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1)).join('')}" fill="none" stroke="var(--y)" stroke-width="2" stroke-linejoin="round"/>${v.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x).toFixed(1)}" r="3" fill="var(--y)"/>`).join('')}</svg>`}

  <div class="edgrid"><label>${t('edCardioName')}${inp(d+'|cname',D.cname)}</label><label>${t('edMin')}${inp(d+'|cmin',D.cmin,'20','numeric')}</label><label>${t('edHr')}${inp(d+'|chr',D.chr,'120–135')}</label></div>
  ${D.ex.map((e,i)=>exEd(d,i,e,D.ex.length)).join('')}
  <div class="btnrow"><button class="btn" data-edaddex="${d}">${t('addEx')}</button><button class="btn danger" data-eddelday="${d}">${t('delDay')}</button></div></section>`}
function editView(){return `<div class="ed">${Object.keys(AD.edit).sort().map(d=>dayEd(d,AD.edit[d])).join('')}
  <div class="btnrow"><button class="btn" data-edaddday>${t('addDay')}</button></div>
  <div class="btnrow"><button class="btn y" data-edsave>${t('save')}</button><button class="btn" data-edcancel>${t('cancel')}</button></div></div>`}
function planView(c){const D=c.days||{},ks=Object.keys(D).filter(k=>D[k].ex&&D[k].ex.length).sort();
  if(!ks.length){const others=AD.clients.filter(x=>x.code!==c.code&&x.days&&Object.keys(x.days).length);
    return `<p class="empty">${t('noProgram')}</p><div class="btnrow" style="margin-top:12px"><button class="btn y" data-edstart>${t('edStart')}</button></div>
      ${others.length?`<div class="ed" style="margin-top:16px"><label>${t('copyFrom')}<select id="copyFrom">${others.map(o=>`<option value="${esc(o.code)}">${esc(o.name)}</option>`).join('')}</select></label><div class="btnrow"><button class="btn" data-acopyprog>${t('copyProg')}</button></div></div>`:''}`}
  return `<div class="btnrow" style="margin-bottom:12px"><button class="btn y" data-edstart>${t('edit')}</button></div>`+ks.map(k=>{const d=D[k];
    return `<div class="plan"><h2>${esc(dayTitle(d))}${d.focus?' · '+esc(tr(d.focus)):''}</h2>${d.ex.map((e,i)=>`<div><b>${i+1}. ${esc(tr(e.name))}</b> <span class="mute">${e.sets}×${esc(e.reps)} ${unitLbl(e.unit)}${e.side?' · '+t('edSide'):''}${e.rest?' · '+t('rest',esc(restTxt(e.rest))):''}</span>${e.alt?`<br><small class="mute">⇄ ${esc(tr(e.alt.name))}</small>`:''}</div>`).join('')}
      ${d.cardio?`<div class="mute">${esc(tr(d.cardio.name))}${d.cardio.min?', '+d.cardio.min+' '+t('min'):''}</div>`:''}</div>`}).join('')}

function renderAdmin(){
  document.body.dataset.view='admin';dock.hidden=true;
  if(!AD.clients){app.innerHTML=`${header()}<div class="intro"><h1>${t('clients')}</h1><p>${AD.err||t('loadingA')}</p></div>${AD.err&&!AD.forbid?`<div class="btnrow"><button class="btn y" data-retry>${t('retry')}</button></div>`:''}`;return}
  const c=AD.sel&&AD.clients.find(x=>x.code===AD.sel);
  if(!c){AD.sel=null;AD.edit=null;
    const rows=AD.clients.map(c=>({c,ss:byDate(c.sessions)})).sort((a,b)=>(b.ss[0]?b.ss[0].date:'').localeCompare(a.ss[0]?a.ss[0].date:''));
    app.innerHTML=`${header()}<div class="intro"><h1>${t('clients')}</h1>${AD.err?`<p class="small sync off">${AD.err} ${t('savedData')}</p>`:''}</div>
      <div class="panel">${rows.map(({c,ss})=>{const l=ss[0],n4=ss.filter(s=>daysAgo(s.date)<28).length,warn=!l||daysAgo(l.date)>7,pain=painOf(ss),pl=plateau(c);
        return `<button class="hitem${warn?' warn':''}" data-aclient="${esc(c.code)}"><span class="d">${esc(c.name.slice(0,1))}</span>
          <span><span class="t">${esc(c.name)}</span><small>${l?t('lastAct',agoTxt(l.date),n4):t('notYet')}</small>${actBars(activity(ss))}
            ${pain.length?`<small class="pain">⚠ ${t('pain')}: ${esc(pain.join(', '))}</small>`:''}${pl.length?`<small class="plat">${t('plateauIn',esc(pl.slice(0,2).join(', ')))}</small>`:''}</span><span class="mute">→</span></button>`}).join('')}</div>
      ${AD.addOpen?`<form class="panel ed" id="addForm"><label>${t('newClient')}<input type="text" id="addName" placeholder="${t('namePh')}" autocomplete="off"></label>
        <label>${t('clientLang')}<select id="addLang">${LANGS.map(([k,n])=>`<option value="${k}"${k==='en'?' selected':''}>${n}</option>`).join('')}</select></label>
        <div class="btnrow"><button class="btn y" type="submit">${t('create')}</button><button class="btn" type="button" data-aaddcancel>${t('cancel')}</button></div></form>`
        :`<div class="btnrow"><button class="btn y" data-aadd>+ ${t('addClient')}</button></div>`}`;
    return}
  const ss=byDate(c.sessions),act=activity(ss),n4=ss.filter(s=>daysAgo(s.date)<28).length,pl=plateau(c);
  const log=ss.length?ss.map(s=>{const n=Object.values(s.ex).reduce((a,e)=>a+e.sets.filter(x=>x&&x.done).length,0),open=AD.open===s.saved;
    return `<button class="hitem" data-ahist="${s.saved}" aria-expanded="${open}"><span class="d">${esc(s.day)}</span>
      <span><span class="t">${fmtDate(s.date,{weekday:'long',day:'numeric',month:'long'})}</span><small>${t('setsN',n)}${s.cardio?t('withCardio'):''}${s.note||Object.values(s.ex).some(e=>e.note)?t('hasNotes'):''}</small></span>
      <span class="mute">${open?'−':'+'}</span></button>
      ${open?`<div class="hdetail">${Object.entries(s.ex).map(([id,e])=>{const r=replyOf(c.replies,s.saved,id);
        return `<div><b>${esc(tr(e.name))}</b> ${e.feel?feelIcon(e.feel):''} ${exSets(e)}${e.note?`<br><i>«${esc(e.note)}»</i>`:''}${trHtml(r,t('you'))}${replyBox(s.saved+'|'+id,r,e.note||e.feel)}</div>`}).join('')}
        ${s.note?`<div><i>«${esc(s.note)}»</i></div>`:''}${(()=>{const r=replyOf(c.replies,s.saved,'');return trHtml(r,t('you'))+replyBox(s.saved+'|',r,s.note)})()}</div>`:''}`}).join(''):`<p class="empty">${t('noWorkouts')}</p>`;
  const pr=progress(c);
  const prog=pr.length?`<div class="prog">${pr.map(p=>progCard(p,pl)).join('')}</div>`:`<p class="empty">${t('noWorkouts')}</p>`;
  const body=AD.tab==='prog'?prog:AD.tab==='plan'?(AD.edit?editView():planView(c)):log;
  app.innerHTML=`${header()}
    <div class="btnrow"><button class="btn" data-aback>${t('backClients')}</button></div>
    <div class="intro"><h1>${esc(c.name)}</h1>
      ${AD.noteEdit?`<div class="ed"><textarea id="cnote" placeholder="${t('notePhA')}">${esc(c.note||'')}</textarea><div class="btnrow"><button class="btn y" data-anotesave>${t('save')}</button><button class="btn" data-anotecancel>${t('cancel')}</button></div></div>`
        :`${c.note?`<p>${esc(c.note)}</p>`:''}<div><button class="btn small" data-anote>${t('editNote')}</button></div>`}</div>
    <div class="ed"><label>${t('clientLang')}<div class="btnrow"><select data-alang style="flex:1">${LANGS.map(([k,n])=>`<option value="${k}"${(c.lang||'en')===k?' selected':''}>${n}</option>`).join('')}</select><button class="btn y" data-alangsave disabled>${t('saveLang')}</button></div><small class="mute">${t('langHint')}</small></label></div>
    <div class="panel alink"><code>${esc(c.link)}</code><button class="btn" data-acopy>${t('copy')}</button></div>
    <div class="panel"><div class="stats"><div class="stat"><b>${n4}</b><span>${t('stat4w')}</span></div><div class="stat"><b>${fmtN(Math.round(n4/4*10)/10)}</b><span>${t('statAvg')}</span></div><div class="stat"><b>${streak(act)}</b><span>${t('statStreak')}</span></div></div>
      <div style="margin-top:12px">${actBars(act)}</div>${pl.length?`<p class="small plat" style="margin:10px 0 0">${t('plateauIn',esc(pl.join(', ')))}</p>`:''}</div>
    <div class="section"><div class="atabs"><button class="btn${AD.tab==='log'?' y':''}" data-atab="log">${t('tabLog')}</button><button class="btn${AD.tab==='prog'?' y':''}" data-atab="prog">${t('tabProg')}</button><button class="btn${AD.tab==='plan'?' y':''}" data-atab="plan">${t('tabPlan')}</button></div></div>
    <div class="section"><div class="panel">${body}</div></div>`;
}
async function adminReply(key){
  const i=key.indexOf('|'),sid=+key.slice(0,i),ex=key.slice(i+1),text=(($('#rep')||{}).value||'').trim();
  try{await adminPost({op:'reply',c:AD.sel,sid,ex,text});
    const c=AD.clients.find(x=>x.code===AD.sel);c.replies=(c.replies||[]).filter(x=>!(x.sid===sid&&x.ex===ex));
    if(text)c.replies.push({sid,ex,text,at:Date.now()});
    try{localStorage.setItem('vt_admin_cache',JSON.stringify(AD.clients))}catch(e){}
    AD.rep=null;toast(t('replySent'));keepScroll(render)
  }catch(e){toast(t('replyFail'))}
}
async function adminAction(fn,okMsg,failMsg){try{await fn();if(okMsg)toast(okMsg);return true}catch(e){toast(failMsg+(e&&e.error?' ('+e.error+')':''));return false}}
const swapEx=(d,i,j)=>{const a=AD.edit[d].ex;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};
function adminClick(d){
  if(d.aclient){AD.sel=d.aclient;AD.tab='log';AD.open=null;AD.rep=null;AD.edit=null;AD.noteEdit=false;render();scrollTo(0,0);return true}
  if('aback' in d){AD.sel=null;AD.rep=null;AD.edit=null;render();scrollTo(0,0);return true}
  if(d.atab){if(AD.edit&&!confirm(t('discard')))return true;AD.tab=d.atab;AD.rep=null;AD.edit=null;keepScroll(render);return true}
  if(d.ahist){AD.open=AD.open===+d.ahist?null:+d.ahist;AD.rep=null;keepScroll(render);return true}
  if(d.areply){AD.rep=d.areply;keepScroll(render);const r=$('#rep');if(r)r.focus({preventScroll:true});return true}
  if('acancel' in d){AD.rep=null;keepScroll(render);return true}
  if(d.asend){adminReply(d.asend);return true}
  if('acopy' in d){const c=AD.clients.find(x=>x.code===AD.sel);
    navigator.clipboard.writeText(c.link).then(()=>toast(t('linkCopied')),()=>toast(t('copyFail')));return true}
  if('retry' in d){AD.err='';render();adminLoad();return true}
  /* подопечные и заметка */
  if('aadd' in d){AD.addOpen=true;render();const i=$('#addName');if(i)i.focus();return true}
  if('aaddcancel' in d){AD.addOpen=false;render();return true}
  if('anote' in d){AD.noteEdit=true;keepScroll(render);return true}
  if('anotecancel' in d){AD.noteEdit=false;keepScroll(render);return true}
  if('anotesave' in d){const note=($('#cnote')||{}).value||'',c=AD.clients.find(x=>x.code===AD.sel);
    adminAction(()=>adminPost({op:'setNote',c:AD.sel,note}),t('noteSaved'),t('saveFail')).then(ok=>{if(ok){c.note=note.trim();AD.noteEdit=false;try{localStorage.setItem('vt_admin_cache',JSON.stringify(AD.clients))}catch(e){}keepScroll(render)}});return true}
  if('alangsave' in d){const c=AD.clients.find(x=>x.code===AD.sel),v=($('[data-alang]')||{}).value;
    adminAction(()=>adminPost({op:'setClientLang',c:AD.sel,lang:v}),t('langSaved'),t('saveFail')).then(ok=>{if(ok){c.lang=v;try{localStorage.setItem('vt_admin_cache',JSON.stringify(AD.clients))}catch(e){}keepScroll(render)}});return true}
  if('acopyprog' in d){const from=($('#copyFrom')||{}).value;if(!from)return true;
    adminAction(()=>adminPost({op:'copyProgram',c:AD.sel,from}),t('progCopied'),t('saveFail')).then(ok=>{if(ok)adminLoad()});return true}
  /* редактор программы */
  if('edstart' in d){const c=AD.clients.find(x=>x.code===AD.sel);AD.edit=toEdit(c.days);if(!Object.keys(AD.edit).length)AD.edit={A:{title:'',focus:'',cname:'',cmin:'',chr:'',ex:[]}};keepScroll(render);return true}
  if('edcancel' in d){AD.edit=null;keepScroll(render);return true}
  if(d.edup){const [x,i]=d.edup.split('|');swapEx(x,+i,+i-1);keepScroll(render);return true}
  if(d.eddn){const [x,i]=d.eddn.split('|');swapEx(x,+i,+i+1);keepScroll(render);return true}
  if(d.eddel){const [x,i]=d.eddel.split('|');AD.edit[x].ex.splice(+i,1);keepScroll(render);return true}
  if(d.edmuscle){const [x,i,m]=d.edmuscle.split('|'),e=AD.edit[x].ex[+i],a=csv(e.muscles).map(canon),k=a.indexOf(m);
    if(k>=0)a.splice(k,1);else a.push(m);e.muscles=a.join(', ');mrefresh(x,+i);return true}
  if(d.edalt){AD.altOpen.add(d.edalt);keepScroll(render);return true}
  if(d.edaddex){AD.edit[d.edaddex].ex.push({id:newId(),name:'',muscles:'',sets:'3',reps:'',unit:'kg',side:false,note:'',rest:'',rpe:'',aid:'',aname:'',amuscles:'',anote:''});keepScroll(render);return true}
  if(d.eddelday){delete AD.edit[d.eddelday];keepScroll(render);return true}
  if('edaddday' in d){const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(x=>!AD.edit[x]);if(L)AD.edit[L]={title:'',focus:'',cname:'',cmin:'',chr:'',ex:[]};keepScroll(render);return true}
  if('edsave' in d){if(!edValid(AD.edit)){toast(t('edErr'));return true}
    adminAction(()=>adminPost({op:'saveProgram',c:AD.sel,days:fromEdit(AD.edit)}),t('progSaved'),t('saveFail')).then(ok=>{if(ok){AD.edit=null;adminLoad()}});return true}
  return false
}
async function adminAdd(){const name=(($('#addName')||{}).value||'').trim();if(!name)return;
  try{const r=await adminPost({op:'addClient',name,lang:($('#addLang')||{}).value||''});AD.addOpen=false;AD.edit=null;await adminLoad();AD.sel=r.code;AD.tab='plan';toast(t('clientAdded'));render();scrollTo(0,0)}
  catch(e){toast(t('saveFail')+(e&&e.error?' ('+e.error+')':''))}}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const btn=ev.target.closest('button');if(!btn)return;const d=btn.dataset;
  if(ADMIN&&adminClick(d))return;
  if(d.start)return startWorkout(d.start);
  if('resume' in d){view='workout';render();scrollTo(0,0);return}
  if('home' in d){view='home';render();scrollTo(0,0);return}
  if('retry' in d){sync='wait';render();refresh();return}
  if(d.hist){openHist=openHist===+d.hist?null:+d.hist;render();return}
  if(d.del){const id=+d.del;store.sessions=store.sessions.filter(s=>s.saved!==id);openHist=null;save();render();removeRemote(id);toast(t('deleted'));return}
  if(d.noteToggle){const id=d.noteToggle,was=openNotes.has(id);was?openNotes.delete(id):openNotes.add(id);keepScroll(render);
    if(!was){const n=document.getElementById('n-'+id);if(n)n.focus({preventScroll:true})}return}
  if(d.swap){const D=store.draft;D.variants[d.swap]=D.variants[d.swap]==='alt'?'main':'alt';save();keepScroll(render);return}
  if(d.tick){const s=store.draft.ex[d.tick].sets[+d.k];s.done=!s.done;
    if(s.done){const r=document.getElementById(`r-${d.tick}-${d.k}`),w=document.getElementById(`w-${d.tick}-${d.k}`);
      if(r&&!s.r&&/^\d+$/.test(r.placeholder))s.r=r.placeholder;
      if(w&&!s.w&&/^[\d.]+$/.test(w.placeholder))s.w=w.placeholder}
    save();keepScroll(render);return}
  if('cardio' in d){store.draft.cardio=!store.draft.cardio;save();keepScroll(render);return}
  if('cancel' in d){const b=$('#confirmBox');b.innerHTML=`<div class="panel section"><p class="exn">${t('cancelQ')}</p><div class="btnrow"><button class="btn danger" data-cancel-yes>${t('yesCancel')}</button><button class="btn" data-cancel-no>${t('no')}</button></div></div>`;b.scrollIntoView({behavior:'smooth',block:'center'});return}
  if('cancelYes' in d){store.draft=null;save();view='home';render();scrollTo(0,0);return}
  if('cancelNo' in d){$('#confirmBox').innerHTML='';return}
  if('finish' in d)return finish();
  if('dismiss' in d){justSaved=null;render();return}
  if('menu' in d){menuOpen=true;render();return}
  if('menuClose' in d){menuOpen=false;render();return}
  if(d.accentPick){applyAccent(d.accentPick);render();return}
  if(d.langPick){setLang(d.langPick);return}
  if(d.feel){const rec=store.draft.ex[d.feelEx];rec.feel=rec.feel===+d.feel?0:+d.feel;save();keepScroll(render);return}
  if('seen' in d){store.seen=[...new Set([...(store.seen||[]),...(store.replies||[]).map(rkey)])];save();render();return}
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='addForm'){ev.preventDefault();adminAdd();return}
  if(ev.target.id!=='codeForm')return;ev.preventDefault();
  const v=$('#codeIn').value.trim();if(!v)return;
  location.search='?c='+encodeURIComponent(v);
});
document.addEventListener('input',ev=>{const el=ev.target;
  if(ADMIN&&'alang' in el.dataset){const c=AD.clients.find(x=>x.code===AD.sel),b=$('[data-alangsave]');if(b)b.disabled=el.value===(c.lang||'en');return}
  if(ADMIN&&el.dataset.ed){edSet(el.dataset.ed,el.type==='checkbox'?el.checked:el.value);
    const q=el.dataset.ed.split('|');if(q.length===3&&q[2]==='muscles')mrefresh(q[0],+q[1]);return}
  if(el.dataset.ex){store.draft.ex[el.dataset.ex].sets[+el.dataset.k][el.dataset.f]=el.value.replace(',','.');save()}
  else if(el.id==='wdate'){store.draft.date=el.value||todayISO();save()}
  else if(el.dataset.exnote){store.draft.ex[el.dataset.exnote].note=el.value;save()}
  else if(el.id==='wnote'){store.draft.note=el.value;save()}
});
// имя упражнения введено → если мышцы пусты, подставляем из справочника (без перерисовки, чтобы не потерять клик)
document.addEventListener('change',ev=>{const el=ev.target,q=ADMIN&&el.dataset&&el.dataset.ed?el.dataset.ed.split('|'):null;
  if(!q||q.length!==3||q[2]!=='name')return;const e=AD.edit&&AD.edit[q[0]]&&AD.edit[q[0]].ex[+q[1]];
  if(e&&!csv(e.muscles).length){const m=libMuscles(e.name);if(m){e.muscles=m.join(', ');mrefresh(q[0],+q[1])}}});
addEventListener('online',refresh);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(ADMIN||view==='home'))refresh()});

function finish(){
  const D=store.draft,ex={};
  PROGRAM[D.day].ex.forEach(x=>{const e=variant(x,D.variants[x.id]);const rec=D.ex[e.id];if(!rec)return;
    const sets=rec.sets.slice(0,x.sets),note=(rec.note||'').trim(),feel=rec.feel||0;
    if(sets.some(s=>s.done||s.w||s.r)||note||feel)ex[e.id]={name:e.name,unit:e.unit,sets,...(note?{note}:{}),...(feel?{feel}:{})}});
  if(!Object.keys(ex).length){toast(t('markOne'));return}
  const s={day:D.day,date:D.date,saved:Date.now(),ex,cardio:D.cardio,note:D.note};
  store.sessions.push(s);store.draft=null;justSaved=s.saved;save();
  view='home';render();scrollTo(0,0);push(s);
}
function keepScroll(fn){const y=scrollY;fn();scrollTo(0,y)}
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2000)}

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(store.days)setProgram(store.days);
render();
refresh();
</script>
</body>
